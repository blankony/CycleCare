name: cycle_care
description: Offline-first period tracker for one user.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  table_calendar: ^3.2.0
  intl: ^0.20.3
  uuid: ^4.5.1
  file_picker: ^10.3.10
  share_plus: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.25.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env

